{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Gestion AgroTrip</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/gestion.css' %}">
</head>
<body class="g-login-body">
    <div class="g-login-card">
        <div class="g-brand center">🌱 Agro<span>Trip</span></div>
        <h2>Espace de gestion</h2>
        <p class="g-login-sub">Connectez-vous pour gérer votre site.</p>

        {% if messages %}
            {% for message in messages %}
            <div class="g-alert g-alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% if form.errors %}
            <div class="g-alert g-alert-error">Identifiant ou mot de passe incorrect.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="g-field">
                <label>Identifiant</label>
                <input type="text" name="username" class="form-control" autofocus required>
            </div>
            <div class="g-field">
                <label>Mot de passe</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="g-btn g-btn-primary g-btn-block">Se connecter</button>
        </form>
    </div>
</body>
</html>
